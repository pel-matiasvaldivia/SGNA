user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    # Honour the original protocol sent by the upstream proxy (NPM terminates TLS
    # and forwards X-Forwarded-Proto=https). Fall back to $scheme if absent so the
    # backend can build correct https redirects instead of insecure http ones.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # --- IP real del cliente -------------------------------------------------
    # Topología: cliente -> NPM (termina TLS) -> este nginx -> api.
    #
    # X-Forwarded-For se APPENDEA en cada salto, y el primer eslabón lo escribe
    # el navegador: si el cliente manda "X-Forwarded-For: 1.2.3.4", la cadena
    # que sale de acá es "1.2.3.4, <IP real>, <IP de nginx>". uvicorn corre con
    # --proxy-headers y, cuando confía en el peer, se queda con el PRIMER
    # elemento — justo el que el cliente pudo inventar.
    #
    # Esa IP queda guardada en la constancia de aprobación de documentos, así
    # que no puede ser un dato que el firmante elija. Por eso acá no se reenvía
    # la cadena recibida: se reemplaza por un único valor calculado. La cadena
    # original igual queda en el access_log ($http_x_forwarded_for) para
    # diagnóstico.
    #
    # NPM PISA X-Real-IP con su propio $remote_addr (no lo appendea), así que
    # ese header es el único dato de origen que el cliente no pudo escribir.
    map $http_x_real_ip $ip_reenviada {
        default $http_x_real_ip;
        ''      $remote_addr;   # no vino de un proxy: el peer es el cliente
    }

    # Quién tiene derecho a decir "la IP real es otra": sólo el proxy de
    # entrada, que llega por red privada. Si alguien pega directo contra el
    # puerto publicado, su X-Real-IP se ignora y vale su IP de origen.
    #
    # Si algún día NPM pasa a correr en otra máquina con dirección pública,
    # agregar esa dirección acá: mientras no esté, la constancia va a registrar
    # la IP de NPM en lugar de la del usuario (dato equivocado, pero nunca uno
    # que el firmante pueda elegir).
    geo $proxy_de_entrada {
        default        0;
        127.0.0.0/8    1;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
        ::1/128        1;
        fc00::/7       1;
    }

    map $proxy_de_entrada $ip_cliente {
        0 $remote_addr;
        1 $ip_reenviada;
    }

    include /etc/nginx/conf.d/*.conf;
}
